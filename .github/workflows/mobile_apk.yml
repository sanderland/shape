name: Mobile APK

# Builds the Android slice app and attaches the APK to the run, so it can be
# installed on a phone without anyone hand-uploading a binary.
#
# The 107 MB ONNX model is not in the repo. It is exported here from KataGo's
# published b18c384nbt-humanv0.ckpt and cached, so only the first run (or a run
# after the export scripts change) pays the ~300 MB download and torch install.

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'tools/onnx_export/**'
      - '.github/workflows/mobile_apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  KATAGO_TAG: v1.17.2
  CKPT_URL: https://github.com/lightvector/KataGo/releases/download/v1.15.0/b18c384nbt-humanv0.ckpt
  MODEL_NAME: b18c384nbt-humanv0.onnx
  MNN_VERSION: 3.6.1

jobs:
  model:
    name: Export ONNX model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keyed on the export scripts: change how the model is built and it rebuilds.
      - name: Cache exported model
        id: cache
        uses: actions/cache@v4
        with:
          path: out
          key: humanv0-${{ env.KATAGO_TAG }}-mnn${{ env.MNN_VERSION }}-${{ hashFiles('tools/onnx_export/*.py', '.github/workflows/mobile_apk.yml') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Install export dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet \
            'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet 'numpy>=1.26' 'onnx>=1.16' 'onnxruntime>=1.19' packaging
          # MNN ships the ONNX converter in its Python package; the app benchmarks
          # MNN's GPU backends against ONNX Runtime, which has none on Android.
          pip install --quiet 'MNN==3.6.1'

      - name: Fetch KataGo python package
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$KATAGO_TAG" https://github.com/lightvector/KataGo.git katago-src

      - name: Download human-SL checkpoint
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL --retry 3 -o models/b18c384nbt-humanv0.ckpt "$CKPT_URL"
          # torch >=2.6 refuses this checkpoint until its defaultdicts are migrated.
          PYTHONPATH="$PWD/katago-src/python" \
            python katago-src/python/migrate_defaultdict_to_dict.py \
              -checkpoint models/b18c384nbt-humanv0.ckpt

      - name: Export ONNX and assets
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/katago-src/python
          SHAPE_MODEL_DIR: ${{ github.workspace }}/models
          SHAPE_ONNX_OUT: ${{ github.workspace }}/out/b18c384nbt-humanv0.onnx
          SHAPE_ASSETS_OUT: ${{ github.workspace }}/out
          SHAPE_FIXTURES_OUT: ${{ github.workspace }}/out
        run: |
          mkdir -p out
          cd tools/onnx_export
          # --no-katago: no engine binary here, so gate onnx against torch instead.
          python export_onnx.py --no-katago
          python export_assets.py
          # Featurizer fixtures, so the Dart port is checked against a model+featurizer
          # pair generated together rather than whatever is committed.
          python export_fixtures.py
          # Same net for MNN. Converted from the ONNX just produced, so the two
          # runtimes in the benchmark are provably the same weights.
          mnnconvert -f ONNX --modelFile "$SHAPE_ONNX_OUT" \
                     --MNNModel "$GITHUB_WORKSPACE/out/humanv0.mnn" --bizCode shape

      - name: Show outputs
        run: ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: out/
          retention-days: 1

  apk:
    name: Build APK
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: mobile/shape_slice/assets

      # MNN publishes prebuilt Android .so files but no Maven artifact, and the
      # repo's .gitignore excludes *.so, so fetch them rather than committing
      # binaries. MNN is what the net runs on; only the CPU backend is shipped,
      # since OpenCL matched it and Vulkan crashed.
      - name: Fetch MNN Android runtime
        working-directory: mobile/shape_slice
        run: |
          pkg="mnn_${MNN_VERSION}_android_armv7_armv8_cpu_opencl_vulkan"
          curl -sL --retry 3 -o mnn.zip \
            "https://github.com/alibaba/MNN/releases/download/${MNN_VERSION}/${pkg}.zip"
          unzip -q mnn.zip
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          for l in libMNN.so libMNN_Express.so libmnncore.so libc++_shared.so; do
            cp "${pkg}/arm64-v8a/$l" android/app/src/main/jniLibs/arm64-v8a/
          done
          rm -rf mnn.zip "$pkg"
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile/shape_slice
        run: flutter pub get

      - name: Analyze
        working-directory: mobile/shape_slice
        run: flutter analyze

      # Checks the Dart metadata encoding against the exported KataGo reference.
      - name: Test
        working-directory: mobile/shape_slice
        run: flutter test

      # The ONNX is only the source the .mnn was converted from; shipping it would
      # add 107MB to the APK for nothing.
      - name: Drop the ONNX model
        working-directory: mobile/shape_slice
        run: rm -f assets/*.onnx

      - name: Check the assets the app needs are present
        working-directory: mobile/shape_slice
        run: |
          ls -la assets
          missing=0
          for f in humanv0.mnn position.bin reference.json \
                   featurizer_fixtures.json; do
            if [ ! -s "assets/$f" ]; then echo "MISSING: assets/$f"; missing=1; fi
          done
          [ "$missing" = 0 ] || {
            echo "Refusing to build: the APK would ship without these, and the failure"
            echo "would only show up as a runtime error on the phone."
            exit 1
          }

      - name: Build release APK (arm64)
        working-directory: mobile/shape_slice
        run: flutter build apk --release --split-per-abi --target-platform=android-arm64

      - name: Confirm the assets made it into the APK
        working-directory: mobile/shape_slice
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          unzip -l "$apk" | grep -q "flutter_assets/assets/humanv0.mnn" \
            || { echo "MISSING FROM APK: humanv0.mnn"; exit 1; }
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libMNN.so" \
            || { echo "MISSING FROM APK: libMNN.so"; exit 1; }
          ls -la "$apk"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: shape-slice-arm64-apk
          path: mobile/shape_slice/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Link the APK on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- shape-slice-apk -->';
            const body = [
              marker,
              '### 📱 SHAPE mobile slice — APK',
              '',
              `**[Download the APK](${process.env.ARTIFACT_URL})** (arm64-v8a, debug-signed)`,
              '',
              'Open that link on the phone while signed into GitHub, unzip, and install the `.apk`.',
              'It needs no network and no permissions.',
              '',
              `Built from ${context.sha.substring(0, 7)}.`,
            ].join('\n');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const existing = (await github.rest.issues.listComments({owner, repo, issue_number}))
              .data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
