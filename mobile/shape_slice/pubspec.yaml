name: shape_slice
description: "SHAPE mobile slice: KataGo human-SL net inference on device."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Listed one by one rather than as a directory: featurizer_fixtures.json lives
  # alongside these but is read from disk by the tests, and bundling it would put
  # 200KB of test data in the APK.
  assets:
    - assets/humanv0.mnn
    - assets/position.bin
    - assets/reference.json
