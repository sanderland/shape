# Minimal deterministic analysis config for the export parity check.
# nnRandomize=false pins the symmetry; useFP16=false forces fp32 on the Metal backend.
# Both are required to compare against a plain fp32 PyTorch forward pass.

logToStderr = false
logSearchInfo = false
logAllRequests = false
logAllResponses = false

reportAnalysisWinratesAs = BLACK
maxVisits = 500

numAnalysisThreads = 1
numSearchThreads = 1

nnMaxBatchSize = 8
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 12
nnRandomize = false
useFP16 = false
